name: habit_time_tracker

services:
  habit_time_tracker:
    build: .
    restart: unless-stopped
    depends_on:
      habit_time_tracker-postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__HabitTimeTrackerBot: "Host=habit_time_tracker-postgres;Port=5432;Database=HabitTimeTrackerBot;Username=postgres;Password=postgres"
      TelegramBotSettings__Token: ${TELEGRAM_TOKEN}

  habit_time_tracker-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: HabitTimeTrackerBot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - habit_time_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HabitTimeTrackerBot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      
volumes:
  habit_time_tracker_pgdata:
